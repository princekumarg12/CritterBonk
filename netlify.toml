[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 requires Node 20+. Pin it so Netlify's build image matches local/CI.
[build.environment]
  NODE_VERSION = "20"

# Single-page app fallback so deep links resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
